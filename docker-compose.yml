services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securetravels
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securetravels"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/securetravels
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-in-prod-long-enough}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret-insecure-change-me}
      # Patterns (requires SecurityConfig allowedOriginPatterns). Covers any local Next port.
      CORS_ALLOWED_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # next.config rewrites are baked at build time — must reach the
        # compose service, not localhost inside the frontend container.
        API_PROXY_TARGET: http://backend:8080
    environment:
      # Browser-facing API origin (unused by client fetch — UI uses /api proxy).
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
      # Also set at runtime in case next start re-reads next.config.ts.
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "3002:3000"
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Phase 3 Module 5 observability.
  #
  # Behind the `monitoring` profile on purpose: the default `docker compose up`
  # must behave exactly as it did before this module existed, and these two
  # containers are not needed to run the application. Start them with:
  #
  #   docker compose --profile monitoring up -d prometheus grafana
  #
  # Note this stack does not include MinIO or RabbitMQ. Those run on the Windows
  # host for local development (see docs/OBSERVABILITY.md), so the messaging
  # dashboard stays flat until MESSAGING_MODE=BROKER.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Without this the "application is down" alert can never fire: a dead
      # Prometheus silently reports every target as still up.
      - --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["monitoring"]
    environment:
      # Dev-only default, matching the JWT_SECRET pattern above. Override in
      # any shared environment.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local-dev-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafanadata:

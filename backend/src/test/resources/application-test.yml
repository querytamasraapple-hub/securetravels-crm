spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/securetravels_test
    username: postgres
    password: ""
  flyway:
    clean-disabled: false
app:
  login-rate-limit:
    capacity: 10000
    refill-per-window: 10000
    window-minutes: 15
  webhook:
    rate-limit:
      capacity: 10000
      refill-per-window: 10000
      window-minutes: 1
  bootstrap-demo-data: false
  whatsapp:
    mode: SANDBOX
    webhook-secret: test-interakt-webhook-secret
    country-code: "+91"
  messaging:
    max-attempts: 3
    retry-backoff-millis: 1
  automation:
    # Module 2 pollers must be dormant under test: the ITs drive the relay,
    # poller and sweeping manually, and a background @Scheduled would race them.
    # Values large enough that no test could conceivably reach them.
    relay-poll-millis: 3600000
    step-poll-millis: 3600000
    trigger-poll-millis: 86400000
    recovery-interval-millis: 86400000
    recovery-grace-millis: 3600000
    poll-batch-size: 20
    event-max-attempts: 5
    # Module 3 guardrails: off by default; GuardrailsIT flips the live config
    # bean per scenario and restores it after, so no static overrides here.
    kill-switch-enabled: false
    dry-run-enabled: false
    rate-limit-per-workflow-per-minute: 0
    max-active-runs-per-workflow: 0
    coordinate-depth-cap: 10000
logging:
  level:
    org.hibernate.SQL: OFF